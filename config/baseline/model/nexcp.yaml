# @package _global_

#### Model params #############################################################
model:
  name: nexcp
  hparams: {}
  # NexCP parameters
  decay_rate: 0.99  # Exponential decay rate for weights
  window_size: 1000  # Maximum number of residuals to keep

#### Dataset params - MUST MATCH BASE MODEL ###################################
dataset:
  name: swat
  sample_rate: 10
  data_dir: null
  connectivity:
    method: correlation
    threshold: 0.3
    include_self: false
    layout: edge_index
  splitting:
    method: temporal
    val_len: 0.4    # MUST match base model
    test_len: 0.2   # MUST match base model

#### Windowing params - MUST MATCH BASE MODEL EXACTLY ###################
window: 100
horizon: 1
stride: 1
delay: 5

scale_target: true
scale_axis: graph
add_exogenous: false

#### Wandb settings ###########################################################
use_wandb: false
wandb:
  project: "anonymous"
  entity: null
  tags: ["nexcp", "baseline"]
  notes: "NexCP baseline evaluation"

#### Run settings #############################################################
run:
  dir: "logs/baseline/nexcp"
  name: "nexcp_evaluation"