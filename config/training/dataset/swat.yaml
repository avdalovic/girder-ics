# @package _global_

#### Dataset params ###########################################################
dataset:
  name: swat
  sample_rate: 10  # Sample every 10 seconds to reduce data size
  data_dir: null   # Will use default data/SWAT directory
  connectivity:
    method: correlation
    threshold: 0.3
    include_self: false
    layout: edge_index
  splitting:
    method: temporal
    val_len: 0.2
    test_len: 0.2

#### Windowing params #########################################################
window: 100       # Changed from 120 to 100 to match transformer's positional encoding
horizon: 1       # 2 min (1 * 10s = 10s)
stride: 1         # 1 min (1 * 10s = 10s)
delay: 5

scale_target: true
scale_axis: node  # Per-sensor scaling (axis=0) - recommended for ICS data
add_exogenous: false  # Keep false - we're using actuators instead of datetime
use_actuators: false   # if they're causing the problem
