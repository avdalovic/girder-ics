defaults:
  - optimizer: lr_default
  - dataset: la
  - model: rnn
  - _self_

hydra:
  run:
      dir: logs/base/${dataset.name}/${model.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}

workers: 0
num_threads: 1

#### Training params ##########################################################
epochs: 200
train_batches: 100 # process at most 100 batches per epoch
patience: 50
batch_size: 32

grad_clip_val: 5
apply_scaler: true
scale_axis: node 

dataset:
  splitting:
    method: temporal
    val_len: 0.4
    test_len: 0.2

save_outputs: true

#### Wandb configuration #####################################################
use_wandb: true
wandb:
  project: corel-ics
  entity: aavdalovic
  tags: [base-model, training, per-node-scaling]
  notes: "Base model training with per-node normalization for ICS sensors"
